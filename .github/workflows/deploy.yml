# Lectoryx（アプリ本体＋公開デモ教材 lectures/）を GitHub Pages に公開する。
#   main に push → tools/build.py で検証（エラーがあれば公開しない）→ _site/ を Pages にデプロイ。
#   授業の教材は別の非公開リポジトリ（courses/）にあり、そちらのワークフローが dist ブランチを作る。
#   初回だけ Settings → Pages → Source を「GitHub Actions」にすること（README 1）。
name: Deploy Lectoryx

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 教材の更新日時を git の履歴から取るため
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 検証と公開フォルダの作成
        run: python tools/build.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
