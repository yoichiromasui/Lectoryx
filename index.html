<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lectoryx">
<meta name="theme-color" content="#f8f9fb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<title>Lectoryx</title>
<link rel="stylesheet" href="core/styles/library.css">
<script type="module" src="core/library/main.js"></script>
</head>
<body>
<header class="lib-head">
  <div class="lib-head-in">
    <div class="lib-brand">
      <img src="assets/icon.svg" width="40" height="40" alt="" class="lib-logo">
      <div class="lib-titles">
        <h1>Lectoryx</h1>
        <div class="lib-tagline">Beyond static lectures.</div>
      </div>
    </div>
    <button type="button" id="lib-all" class="lib-btn" hidden>すべてダウンロード</button>
    <button type="button" id="lib-refresh" class="lib-btn">更新を確認</button>
    <button type="button" id="lib-menu" class="lib-btn icon" title="設定・バックアップ" aria-label="設定・バックアップ">⋯</button>
  </div>
</header>
<main class="lib-main">
  <div class="lib-catalog-head">
    <h2 id="lib-title" class="lib-catalog-title">My Lectures</h2>
    <div id="lib-sub" class="lib-sub"></div>
  </div>
  <div id="lib-banners"></div>
  <div id="lib-list"></div>
</main>
<noscript>JavaScript を有効にしてください。</noscript>
</body>
</html>
